name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 推送 v* 标签时触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: |
          cd dist
          zip -r ../miaob-extension-${{ github.ref_name }}.zip . -x "*.DS_Store"
          cd ..

      - name: Extract changelog notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs')
            const md = fs.readFileSync('CHANGELOG.md', 'utf8')
            const tag = '## ' + process.argv[1]
            const start = md.indexOf(tag)
            if (start < 0) { fs.writeFileSync('release-notes.md', '## ' + process.argv[1]); process.exit(0) }
            let end = md.indexOf('\n---', start)
            if (end < 0) end = md.length
            fs.writeFileSync('release-notes.md', md.slice(start, end).trim())
          " "$VER"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: miaob-extension-*.zip
          body_path: release-notes.md
          draft: false
          prerelease: false
