name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 推送 v* 标签时触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: |
          cd dist
          zip -r ../miaob-extension-${{ github.ref_name }}.zip . -x "*.DS_Store"
          cd ..

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: miaob-extension-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
